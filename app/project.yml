name: Earned
options:
  bundleIdPrefix: com.earned
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  EarnedKit:
    path: ../packages/EarnedKit

targets:
  Earned:
    type: application
    platform: iOS
    sources:
      - path: Earned
        # Referenced by CODE_SIGN_ENTITLEMENTS, not bundled as a resource.
        excludes:
          - "Earned.entitlements"
    dependencies:
      - package: EarnedKit
        product: EarnedKit
    info:
      path: Earned/Info.plist
      properties:
        CFBundleDisplayName: Earned
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    # Screen Time. Family Controls (Development) is self-serve once enrolled in
    # the Apple Developer Program — no approval needed to build and run on your
    # own device. Shipping to TestFlight or the App Store additionally needs
    # Family Controls (Distribution), which Apple reviews by hand, per bundle
    # id and separately for each Screen Time extension. See app/README.md.
    #
    # Checked in rather than generated from `properties`, so a change to what
    # Earned is allowed to do shows up in a diff.
    entitlements:
      path: Earned/Earned.entitlements
    settings:
      base:
        # Must be globally unique across all of Apple's developer accounts.
        # A free personal team rejects an identifier someone else registered,
        # so this is namespaced rather than the generic com.earned.app.
        PRODUCT_BUNDLE_IDENTIFIER: com.pattheratch.earned
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        # Swift 5 language mode: the app shell is plain SwiftUI and does not
        # need Swift 6 strict concurrency. EarnedKit itself builds in Swift 6.
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Set explicitly as well as via `entitlements:` above. Without
        # this reaching the signed binary, the sandbox refuses the XPC
        # lookup to com.apple.FamilyControlsAgent with "error 159 -
        # Sandbox restriction" and authorization can never succeed.
        CODE_SIGN_ENTITLEMENTS: Earned/Earned.entitlements
        GENERATE_INFOPLIST_FILE: NO
