name: Earned
options:
  bundleIdPrefix: com.earned
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  EarnedKit:
    path: ../packages/EarnedKit
  EarnedMedia:
    path: ../packages/EarnedMedia

targets:
  Earned:
    type: application
    platform: iOS
    sources:
      - path: Earned
        # Referenced by CODE_SIGN_ENTITLEMENTS, not bundled as a resource.
        excludes:
          - "Earned.entitlements"
    dependencies:
      - package: EarnedKit
        product: EarnedKit
      - target: EarnedMonitor
      - package: EarnedMedia
        product: EarnedMedia
    info:
      path: Earned/Info.plist
      properties:
        CFBundleDisplayName: Earned
        # Names the asset-catalog icon set. Xcode injects this itself when it
        # generates the Info.plist, but this target supplies its own
        # (GENERATE_INFOPLIST_FILE is NO), so it is stated here rather than
        # left to a merge step — a missing icon shows up as a grey placeholder
        # on notifications and in Settings, with no build error to explain it.
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        # Stated rather than left to XcodeGen's defaults, because the app now
        # *reads* them: You → About shows "0.1 (1)" so a tester can say which
        # binary they were holding. A key that silently stopped being written
        # would turn that screen into "? (?)".
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Export compliance, declared once here instead of answered by hand on
        # every TestFlight upload — where the honest answer is the same every
        # time and a mis-click costs a day.
        #
        # Earned's only cryptography is HTTPS to Supabase (the OS's own) and
        # Ed25519 *verification* of grant signatures via CryptoKit. Both are
        # exempt uses: encryption provided by the platform, and authentication.
        # Earned implements no algorithm of its own and offers no encryption
        # feature to the user.
        #
        # Patrick should confirm this reading once against Apple's current
        # questionnaire before the first upload (docs/release.md §2); it is
        # recorded here so the answer is reviewable rather than remembered.
        ITSAppUsesNonExemptEncryption: false
        # Shown on the Health permission sheet. Written to say exactly what is
        # read and why, because that sheet is the entire consent conversation.
        NSHealthShareUsageDescription: >-
          Earned reads finished workouts so a run recorded by your watch or a
          workout app can complete your commitments. Nothing else is read, and
          nothing is written.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    # Screen Time. Family Controls (Development) is self-serve once enrolled in
    # the Apple Developer Program — no approval needed to build and run on your
    # own device. Shipping to TestFlight or the App Store additionally needs
    # Family Controls (Distribution), which Apple reviews by hand, per bundle
    # id and separately for each Screen Time extension. See app/README.md.
    #
    # Checked in rather than generated from `properties`, so a change to what
    # Earned is allowed to do shows up in a diff. Deliberately NOT declared via
    # an `entitlements:` block here: XcodeGen treats that block as "generate
    # this file", and with no `properties` it regenerates it as an empty dict —
    # silently stripping Family Controls, Sign in with Apple and HealthKit on
    # every `xcodegen generate`. CODE_SIGN_ENTITLEMENTS below is the only
    # reference the build actually needs.
    settings:
      base:
        # Must be globally unique across all of Apple's developer accounts.
        # A free personal team rejects an identifier someone else registered,
        # so this is namespaced rather than the generic com.earned.app.
        PRODUCT_BUNDLE_IDENTIFIER: com.pattheratch.earned
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        # Swift 5 language mode: the app shell is plain SwiftUI and does not
        # need Swift 6 strict concurrency. EarnedKit itself builds in Swift 6.
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Set explicitly as well as via `entitlements:` above. Without
        # this reaching the signed binary, the sandbox refuses the XPC
        # lookup to com.apple.FamilyControlsAgent with "error 159 -
        # Sandbox restriction" and authorization can never succeed.
        CODE_SIGN_ENTITLEMENTS: Earned/Earned.entitlements
        GENERATE_INFOPLIST_FILE: NO

  # The half of enforcement that runs when the app does not: the system wakes
  # this at a scheduled deadline and it applies the shield the app worked out
  # in advance. A separate bundle identifier, so it needs Family Controls
  # enabled on its own App ID — and its own Distribution review before
  # TestFlight (docs/family-controls-request.md).
  EarnedMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: EarnedMonitor
        excludes:
          - "EarnedMonitor.entitlements"
      # Shared verbatim with the app rather than reimplemented. The plan is the
      # contract between the two processes, and two copies of a format that
      # must agree forever is how they stop agreeing.
      - path: Earned/Enforcement/ShieldPlan.swift
    # No `entitlements:` block here, for the reason spelled out on the app
    # target above — and this target had exactly the bug that comment warns
    # about. XcodeGen's FileWriter does `writePlist(plist.properties, path:)`
    # for any target declaring one, so a block with no `properties` deletes the
    # checked-in file and writes `<dict/>` over it. Every `xcodegen generate`
    # therefore stripped the monitor's Family Controls entitlement and its App
    # Group, and nothing said so: the build succeeds, the extension signs, the
    # system wakes it on time — and it has no shield authority and a nil
    # container URL, so it shields nothing. The exact bypass EarnedMonitor
    # exists to close, reopened by the build system on every regeneration.
    # CODE_SIGN_ENTITLEMENTS below is the only reference the build needs.
    info:
      path: EarnedMonitor/Info.plist
      properties:
        CFBundleDisplayName: Earned Monitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MonitorExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pattheratch.earned.monitor
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: EarnedMonitor/EarnedMonitor.entitlements
        GENERATE_INFOPLIST_FILE: NO
