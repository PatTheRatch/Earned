name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  earnedkit-linux:
    name: EarnedKit tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test --package-path packages/EarnedKit

  earnedkit-macos:
    name: EarnedKit tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test --package-path packages/EarnedKit
      # EarnedMedia wraps ImageIO, so it tests on Apple platforms only — which
      # is exactly why it is not part of EarnedKit.
      - name: Run EarnedMedia tests
        run: swift test --package-path packages/EarnedMedia

  backend:
    name: Backend schema + RLS (${{ matrix.layout }} layout)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `default` is a bare Postgres (pgcrypto in public); `supabase` is how
        # the real project is laid out (pgcrypto in extensions). Both must
        # pass, or a pinned search_path is quietly wrong in production.
        layout: [default, supabase]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      EARNED_LAYOUT: ${{ matrix.layout }}
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Migrate and test
        run: backend/tests/run.sh

  partner-page:
    name: Edge functions and link router
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck the edge function
        run: deno check supabase/functions/approval/index.ts
      - name: Test the renderer
        run: deno test supabase/functions/approval/
      - name: Typecheck and test the grant signer
        run: deno check supabase/functions/grants/index.ts && deno test supabase/functions/grants/
      - name: Typecheck the web worker
        run: deno check web/src/index.ts
      - name: Test the link router
        run: deno test web/src/

  release-config:
    # The build below signs nothing, so it cannot notice the failure modes that
    # only a *distributable* build has: a stripped entitlement, an App Group
    # the two processes no longer share, a missing privacy string. Each of those
    # is green here and fatal on a device, days later. Cheap enough to run on
    # Linux without Xcode.
    name: Release config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate signing, entitlements and Info.plist
        run: python3 tools/validate-release-config.py

  app-build:
    name: iOS app builds
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec app/project.yml --project app
      # `xcodegen generate` writes plists as well as the project, and it used to
      # write an empty one over the monitor's entitlements — stripping Family
      # Controls and the App Group, with a green build either side of it. The
      # config check catches the declaration that causes it; this catches the
      # effect, including any other way generation could rewrite these files.
      - name: Generation did not rewrite the entitlements
        run: git diff --exit-code -- 'app/**/*.entitlements'
      # Both bundles, not just the app's. The monitor's plist declared no
      # version keys at all, so XcodeGen wrote its own defaults into the
      # extension while the app carried the real ones — an upload App Store
      # Connect refuses, with every check either side of it green.
      - name: The generated Info.plists carry the version keys, and agree
        run: |
          plist() { /usr/libexec/PlistBuddy -c "Print :$2" "$1" 2>/dev/null; }
          for key in CFBundleShortVersionString CFBundleVersion \
                     ITSAppUsesNonExemptEncryption NSHealthShareUsageDescription; do
            plist app/Earned/Info.plist "$key" >/dev/null \
              || { echo "generated app Info.plist is missing $key" >&2; exit 1; }
          done
          for key in CFBundleShortVersionString CFBundleVersion \
                     NSExtension:NSExtensionPointIdentifier; do
            plist app/EarnedMonitor/Info.plist "$key" >/dev/null \
              || { echo "generated monitor Info.plist is missing $key" >&2; exit 1; }
          done
          for key in CFBundleShortVersionString CFBundleVersion; do
            a=$(plist app/Earned/Info.plist "$key")
            m=$(plist app/EarnedMonitor/Info.plist "$key")
            [ "$a" = "$m" ] \
              || { echo "$key: app is $a, monitor is $m — the extension and its host must agree" >&2; exit 1; }
          done
      - name: Build
        run: |
          xcodebuild build \
            -project app/Earned.xcodeproj \
            -scheme Earned \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
