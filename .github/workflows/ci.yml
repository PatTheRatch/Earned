name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  earnedkit-linux:
    name: EarnedKit tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test --package-path packages/EarnedKit

  earnedkit-macos:
    name: EarnedKit tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test --package-path packages/EarnedKit

  app-build:
    name: iOS app builds
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec app/project.yml --project app
      - name: Build
        run: |
          xcodebuild build \
            -project app/Earned.xcodeproj \
            -scheme Earned \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
