name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  earnedkit-linux:
    name: EarnedKit tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test --package-path packages/EarnedKit

  earnedkit-macos:
    name: EarnedKit tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test --package-path packages/EarnedKit

  backend:
    name: Backend schema + RLS (${{ matrix.layout }} layout)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `default` is a bare Postgres (pgcrypto in public); `supabase` is how
        # the real project is laid out (pgcrypto in extensions). Both must
        # pass, or a pinned search_path is quietly wrong in production.
        layout: [default, supabase]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      EARNED_LAYOUT: ${{ matrix.layout }}
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Migrate and test
        run: backend/tests/run.sh

  partner-page:
    name: Partner page renderer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck the edge function
        run: deno check backend/functions/approval/index.ts
      - name: Test the renderer
        run: deno test backend/functions/approval/

  app-build:
    name: iOS app builds
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec app/project.yml --project app
      - name: Build
        run: |
          xcodebuild build \
            -project app/Earned.xcodeproj \
            -scheme Earned \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
