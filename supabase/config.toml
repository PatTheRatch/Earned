# Supabase CLI configuration.
#
# Deliberately minimal: it exists so the one security-relevant deployment
# setting is checked in rather than typed from memory at deploy time. It is
# not a mirror of the project's dashboard settings, and nothing here should be
# treated as the source of truth for auth, database or storage configuration.

project_id = "earned"

# The partner page (docs/accountability-architecture.md §18). Its code is in
# functions/approval/ beside this file, which is where the CLI looks by
# default — an earlier attempt to keep it under backend/ and point at it with
# `entrypoint` failed twice, because that key resolves relative to this
# directory rather than the repo root as the docs say. Not worth fighting a
# tool over where a directory sits.
#
# `verify_jwt = false` is required and correct, and it lives in this file
# rather than in a `--no-verify-jwt` flag on purpose: partners are strangers
# with no Earned account (S4), and the 256-bit token in the URL is the entire
# credential. Forgetting the flag would deploy a page that demands a JWT from
# people who have none — a break that only shows up when a real partner opens
# a real link, which is the worst possible moment to find out.
[functions.approval]
verify_jwt = false
