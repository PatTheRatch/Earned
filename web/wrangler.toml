# earntherest.com — the marketing site, and a proxy for the two token paths.
#
# Deploy with `npx wrangler deploy` from this directory. See
# ../docs/deployment.md §5 for the full walk-through, including the DNS and
# rate-limiting steps that live in the dashboard rather than in this file.

name = "earned-web"
main = "src/index.ts"
compatibility_date = "2026-08-31"

# The static site. Anything the router does not recognise as a token path is
# served from here.
assets = { directory = "./public", binding = "ASSETS" }

# Public, not a secret: it is the origin of the project's edge functions, and
# the token in the URL is the credential (S1, S2).
[vars]
SUPABASE_FUNCTIONS_URL = "https://xqdobukkwqjgbpykwoxk.functions.supabase.co"

# Hostnames are attached in the Cloudflare dashboard (Workers & Pages → the
# worker → Settings → Domains & Routes), because it depends on the zone being
# active. Add each as a **Custom Domain**, not a Route:
#
#   earntherest.com
#   www.earntherest.com
#
# A Custom Domain creates the proxied DNS record itself. A Route is pattern
# matching over a hostname that must already resolve, so on a fresh zone with
# no records it matches nothing and the site stays unreachable.
